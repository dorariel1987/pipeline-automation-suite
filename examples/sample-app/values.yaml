serviceName: sample-api
replicaCount: 2

image:
  repository: myacr.azurecr.io/sample-api
  tag: "0.1.0"

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: sample-api.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: sample-api-tls
      hosts:
        - sample-api.example.com

env:
  - name: PORT
    value: "8080"
  - name: LOG_LEVEL
    value: info

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
