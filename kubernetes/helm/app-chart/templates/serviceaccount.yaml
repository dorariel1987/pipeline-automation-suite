{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "app.serviceAccountName" . }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
  annotations:
    {{- with .Values.serviceAccount.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- if .Values.azureWorkloadIdentityClientId }}
    azure.workload.identity/client-id: {{ .Values.azureWorkloadIdentityClientId | quote }}
    {{- end }}
{{- end -}}
