apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: sample-app
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: sample-app
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: sample-app
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: sample-app
  minReplicas: 4
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
